name: Build and Auto Release SnoopingOwl

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  id-token: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build-agent:
    name: Build .NET Agent + Updater
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
      version: ${{ steps.sha.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: |
          dotnet restore agent/agent.csproj
          dotnet restore agent/updater/Updater.csproj

      - name: Publish Agent (single-file, self-contained, versioned)
        run: |
          dotnet publish agent/agent.csproj `
            -c Release -r win-x86 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$env:VERSION `
            -o published

      - name: Publish Updater (single-file, self-contained, versioned)
        run: |
          dotnet publish agent/updater/Updater.csproj `
            -c Release -r win-x86 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$env:VERSION `
            -o published

      - name: Compute SHA-256 of agent exe
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash published\SnoopingOwl.Agent.exe -Algorithm SHA256).Hash.ToLower()
          Write-Output "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Output "version=$env:VERSION" >> $env:GITHUB_OUTPUT

      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snoopingowl-agent
          path: published/
          retention-days: 7

  create-release:
    name: Create Auto Release
    runs-on: windows-latest
    needs: build-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Agent Artifact
        uses: actions/download-artifact@v4
        with:
          name: snoopingowl-agent
          path: published/

      - name: Create Auto Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-agent.outputs.version }}
          name: "SnoopingOwl v${{ needs.build-agent.outputs.version }}"
          body: |
            ## SnoopingOwl v${{ needs.build-agent.outputs.version }}

            ### Auto-generated release on push to main

            ### Artifacts
            - `SnoopingOwl.Agent.exe` - the Windows service agent (self-contained, no .NET needed)
            - `SnoopingOwl.Updater.exe` - the auto-update helper (used by the agent)

            ### Update integrity (rule 30)
            SHA-256 of `SnoopingOwl.Agent.exe`: `${{ needs.build-agent.outputs.sha256 }}`

            ### How to test
            1. Run the backend: `node server.js`
            2. Run the agent: `SnoopingOwl.Agent.exe /runasconsole`
            3. View connection events in both consoles

          draft: false
          files: |
            published/SnoopingOwl.Agent.exe
            published/SnoopingOwl.Updater.exe
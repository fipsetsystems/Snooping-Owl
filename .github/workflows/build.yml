name: Auto Release SnoopingOwl

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  id-token: write

jobs:
  create-release:
    name: Create Auto Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Auto Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "SnoopingOwl v1.0.0 (${{ github.run_number }})"
          body: |
            ## SnoopingOwl v1.0.0

            ### Auto-generated release on push to main

            ### How to test
            1. Run the backend: `node server.js`
            2. Run the agent: `published\SnoopingOwl.Agent.exe /runasconsole`
            3. View connection events in both consoles

          draft: false
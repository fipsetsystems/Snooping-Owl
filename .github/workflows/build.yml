name: Build and Auto Release SnoopingOwl

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  id-token: write

jobs:
  build-agent:
    name: Build .NET Agent
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore agent/agent.csproj

      - name: Build Agent
        run: dotnet build agent/agent.csproj --configuration Release --no-restore

      - name: Publish Agent (single-file exe)
        run: |
          dotnet publish agent/agent.csproj `
            -c Release -r win-x86 --self-contained false `
            -p:PublishSingleFile=true -o published

      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snoopingowl-agent
          path: published/
          retention-days: 7

  create-release:
    name: Create Auto Release
    runs-on: windows-latest
    needs: build-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Agent Artifact
        uses: actions/download-artifact@v4
        with:
          name: snoopingowl-agent
          path: published/

      - name: Create Auto Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "SnoopingOwl v1.0.0"
          body: |
            ## SnoopingOwl v1.0.0

            ### Auto-generated release on push to main

            ### How to test
            1. Run the backend: `node server.js`
            2. Run the agent: `published\SnoopingOwl.Agent.exe /runasconsole`
            3. View connection events in both consoles

          draft: false
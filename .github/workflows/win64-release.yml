name: win64-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content agent/version.json | ConvertFrom-Json).version
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "artifact=SnoopingOwl-Agent-$v-win64.exe" >> $env:GITHUB_OUTPUT

      - name: Install Qt for Windows
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 -m qtwebsockets -O C:\Qt

      - name: Configure agent
        shell: pwsh
        run: |
          cmake -S agent -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.11.2\msvc2022_64"

      - name: Build agent (win64 Release)
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Stage release artifact
        shell: pwsh
        run: |
          Copy-Item build\Release\agent.exe `
            "$env:RUNNER_TEMP\${{ steps.version.outputs.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ env.RUNNER_TEMP }}/${{ steps.version.outputs.artifact }}

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SnoopingOwl Agent ${{ steps.version.outputs.version }}
          files: ${{ env.RUNNER_TEMP }}/${{ steps.version.outputs.artifact }}
          draft: true
          fail_on_unmatched_files: true
name: win64-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content agent/version.json | ConvertFrom-Json).version
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "artifact=SnoopingOwl-Agent-$v-win64.exe" >> $env:GITHUB_OUTPUT

      - name: Install Qt for Windows
        shell: pwsh
        run: |
          # aqtinstall 3.3.0 (PyPI) predates Qt's new mirror layout for 6.11+;
          # pin the fix from PR #1000 until it ships in a release.
          pip install "git+https://github.com/miurahr/aqtinstall.git@f383b3c7d9658e881bd8ce8810057393bd934ee1"
          aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 -m qtwebsockets -O C:\Qt

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure agent
        shell: pwsh
        run: |
          # Ninja + MSVC env instead of the VS generator: windows-latest
          # images rotate VS versions, which breaks the generator name.
          cmake -S agent -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.11.2\msvc2022_64"

      - name: Build agent (win64 Release)
        shell: pwsh
        run: |
          cmake --build build

      - name: Stage release artifact
        shell: pwsh
        run: |
          Copy-Item build\agent.exe `
            "$env:RUNNER_TEMP\${{ steps.version.outputs.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ env.RUNNER_TEMP }}/${{ steps.version.outputs.artifact }}

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SnoopingOwl Agent ${{ steps.version.outputs.version }}
          files: ${{ env.RUNNER_TEMP }}/${{ steps.version.outputs.artifact }}
          draft: true
          fail_on_unmatched_files: true
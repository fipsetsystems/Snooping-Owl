name: win64-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content agent/version.json | ConvertFrom-Json).version
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "artifact=SnoopingOwl-Agent-$v-win64.exe" >> $env:GITHUB_OUTPUT

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache static Qt + OpenSSL
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\QtStatic
            C:\vcpkg\installed
          key: qt-static-6.11.2-openssl-v1

      - name: Install vcpkg + static OpenSSL
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Static OpenSSL is required so the single-exe agent can speak
          # wss:// (TLS). Built once via vcpkg, cached thereafter.
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe install openssl:x64-windows-static --disable-metrics

      - name: Build static Qt (qtbase + qtwebsockets)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Qt ships no Windows static kits; build the subset the agent
          # needs (Core/Network/WebSockets + OpenSSL) statically so the
          # release is a single agent.exe with no DLLs or plugins.
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force C:\Qt-src | Out-Null
          foreach ($m in @("qtbase", "qtwebsockets")) {
            $u = "https://download.qt.io/archive/qt/6.11/6.11.2/submodules/${m}-everywhere-src-6.11.2.tar.xz"
            Invoke-WebRequest -Uri $u -OutFile "C:\Qt-src\${m}.tar.xz"
            tar -xf "C:\Qt-src\${m}.tar.xz" -C C:\Qt-src
          }

          cmake -S C:\Qt-src\qtbase-everywhere-src-6.11.2 -B C:\Qt-src\qtbase-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=C:\QtStatic `
            -DBUILD_SHARED_LIBS=OFF `
            -DFEATURE_gui=OFF -DFEATURE_opengl=OFF -DFEATURE_dbus=OFF `
            -DFEATURE_openssl=ON -DFEATURE_openssl_linked=ON `
            -DOPENSSL_ROOT_DIR=C:\vcpkg\installed\x64-windows-static `
            -DFEATURE_testlib=OFF `
            -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF
          cmake --build C:\Qt-src\qtbase-build --target install

          cmake -S C:\Qt-src\qtwebsockets-everywhere-src-6.11.2 `
            -B C:\Qt-src\qtwebsockets-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=C:\QtStatic `
            -DCMAKE_PREFIX_PATH=C:\QtStatic `
            -DBUILD_SHARED_LIBS=OFF `
            -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF
          cmake --build C:\Qt-src\qtwebsockets-build --target install

      - name: Configure agent (static)
        shell: pwsh
        run: |
          cmake -S agent -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:\QtStatic"

      - name: Build agent (win64 Release, static)
        shell: pwsh
        run: |
          cmake --build build

      - name: Stage release artifact
        shell: pwsh
        run: |
          Copy-Item build\agent.exe `
            "$env:RUNNER_TEMP\${{ steps.version.outputs.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ runner.temp }}/${{ steps.version.outputs.artifact }}

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SnoopingOwl Agent ${{ steps.version.outputs.version }}
          files: ${{ runner.temp }}/${{ steps.version.outputs.artifact }}
          fail_on_unmatched_files: true